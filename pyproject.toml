[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chair-sedentary-monitor"
version = "0.1.0"
description = "椅子久坐检测：用 BLE 5.0 姿态传感器判断有人/无人，累计久坐时间并提醒（Linux）"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "chenweidu666" }]
keywords = ["sedentary", "occupancy", "imu", "ble", "bluetooth", "bleak", "wt9011", "linux", "chair"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Home Automation",
]
dependencies = [
    "bleak>=0.21",
    "wt9011-linux @ git+https://github.com/chenweidu666/APP-WT9011DCL-BT50-Linux.git",
]

[project.optional-dependencies]
tray = ["PySide6>=6.5"]
dev = ["pytest>=7"]

[project.scripts]
chair-monitor = "chairmon.cli:main"

[project.urls]
Homepage = "https://github.com/chenweidu666/APP-Chair-Sedentary-Monitor"
Issues = "https://github.com/chenweidu666/APP-Chair-Sedentary-Monitor/issues"

[tool.setuptools]
packages = ["chairmon"]
